{% set name = "tsnetplus" %}
{% set version = "0.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/tomjanus/TSNetPlus/archive/refs/tags/{{ version }}.tar.gz

build:
  number: 0
  script: "{{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation"

requirements:
  host:
    - python >=3.12
    - pip
    - setuptools
  run:
    - python >=3.12
    - pandas
    - numpy
    - scipy
    - matplotlib
    - plotly
    - wntr
    - networkx
    - rich

test:
  imports:
    - tsnetplus

about:
  home: https://github.com/tomjanus/TSNetPlus
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: >
    Transient simulation in water distribution networks using the method of
    characteristics, a fork of TSNet with faster simulation kernels.
  description: |
    TSNetPlus is a fork of TSNet that performs transient simulation in water
    distribution networks using the method of characteristics (MOC). It adds
    pluggable simulation kernels, including an optional Numba
    just-in-time compiled kernel, which substantially reduce the execution
    time of transient simulations.
  doc_url: https://github.com/tomjanus/TSNetPlus
  dev_url: https://github.com/tomjanus/TSNetPlus

extra:
  recipe-maintainers:
    - tomjanus

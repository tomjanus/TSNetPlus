name: Docs

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Required to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Do not cancel a deployment that is in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so that sphinx.ext.githubpages can build the
          # .nojekyll marker.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        # The package itself is required by autodoc.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_dev.txt
          pip install -e ".[speedups]"
      - name: Build the documentation
        # Warnings are errors so that the documentation cannot rot silently.
        run: sphinx-build -W -b html docs _site
      - name: Upload the documentation
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # WNTR publishes wheels only up to Python 3.13, so on 3.14 it is built
      # from source and needs a C++ compiler.
      CXX: g++
      CC: gcc
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        # Installs the runtime dependencies, the test tooling and the package
        # itself in editable mode. The `speedups` extra pulls in Numba, which
        # the backend tests exercise.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_dev.txt
          pip install -e ".[speedups]"
      - name: Run tests
        # `python -m pytest` also puts the repository root on sys.path.
        run: python -m pytest -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      - name: Run flake8
        # The inherited TSNet sources are not PEP 8 compliant; only the code
        # maintained in this fork is linted (see tox.ini).
        run: flake8 tests benchmarks/benchmark_backends.py
